[workspace]
resolver = "2"
members = [
    "crates/core/*",
    "crates/primitives/*",
    "crates/framework/*",
    "crates/protocols/*",
    "crates/tecdsa",
]

[workspace.package]
edition = "2021"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jiangjiang-jiang/tecdsa-lib"

[workspace.dependencies]
# Curves
k256 = { version = "0.14.0-rc", default-features = false, features = ["arithmetic", "serde", "expose-field"] }
p256 = { version = "0.14.0-rc", default-features = false, features = ["arithmetic", "serde"] }
elliptic-curve = { version = "0.14.0-rc", default-features = false, features = ["sec1"] }

# Big integers
gmp-mpfr-sys = "1.7"
# No "serde" feature: rug's native serde encodes integers as radix-16 strings
# ({radix, value}), which doubles wire size under bincode. `Integer` fields
# use the compact `tecdsa_bigint::int_wire` adapter instead. Re-enabling this
# feature would silently regress that (nothing in the workspace legitimately
# needs rug's own serde impl).
rug = { version = "1" }

# Hashing
sha2 = "0.10"
sha3 = "0.10"
digest = "0.10"
hmac = "0.12"

# Randomness
rand_core = { version = "0.6", default-features = false }
rand = "0.8"

# Security
zeroize = { version = "1", features = ["derive"] }
subtle = "2.6"

# Serialization
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
serde_bytes = { version = "0.11", default-features = false, features = ["alloc"] }
bincode = { version = "2.0.0-rc.3", features = ["serde"] }

# Transcript
merlin = "3"

# Digest
udigest = { version = "0.2", default-features = false }

# Errors
thiserror = { version = "2", default-features = false }

# Async (transport only)
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

# Workspace crates — core
tecdsa-core = { path = "crates/core/tecdsa-core", default-features = false }
tecdsa-bigint = { path = "crates/core/tecdsa-bigint" }
tecdsa-curve = { path = "crates/core/tecdsa-curve", default-features = false }
# Workspace crates — primitives
tecdsa-commit = { path = "crates/primitives/tecdsa-commit" }
tecdsa-fs = { path = "crates/primitives/tecdsa-fs" }
tecdsa-vss = { path = "crates/primitives/tecdsa-vss" }
tecdsa-paillier = { path = "crates/primitives/tecdsa-paillier" }
tecdsa-pedersen-mod = { path = "crates/primitives/tecdsa-pedersen-mod" }
tecdsa-class-group = { path = "crates/primitives/tecdsa-class-group" }
tecdsa-joye-libert = { path = "crates/primitives/tecdsa-joye-libert" }
tecdsa-ot = { path = "crates/primitives/tecdsa-ot" }
tecdsa-elgamal = { path = "crates/primitives/tecdsa-elgamal" }
tecdsa-evrf = { path = "crates/primitives/tecdsa-evrf" }
tecdsa-hd = { path = "crates/primitives/tecdsa-hd" }
# Workspace crates — framework
tecdsa-protocol = { path = "crates/framework/tecdsa-protocol", default-features = false }
tecdsa-wire = { path = "crates/framework/tecdsa-wire" }
tecdsa-transport = { path = "crates/framework/tecdsa-transport" }
tecdsa-session = { path = "crates/framework/tecdsa-session" }
tecdsa-testkit = { path = "crates/framework/tecdsa-testkit" }
tecdsa-bench = { path = "crates/framework/tecdsa-bench" }
# Workspace crates — protocols
tecdsa-cggmp20 = { path = "crates/protocols/tecdsa-cggmp20" }
tecdsa-dkls23 = { path = "crates/protocols/tecdsa-dkls23" }
tecdsa-gg18 = { path = "crates/protocols/tecdsa-gg18" }
tecdsa-ggn16 = { path = "crates/protocols/tecdsa-ggn16" }
tecdsa-ln18 = { path = "crates/protocols/tecdsa-ln18" }
tecdsa-wmy23 = { path = "crates/protocols/tecdsa-wmy23" }
tecdsa-llz25 = { path = "crates/protocols/tecdsa-llz25" }
tecdsa-tx25 = { path = "crates/protocols/tecdsa-tx25" }
tecdsa-jtx25 = { path = "crates/protocols/tecdsa-jtx25" }
tecdsa-wmc24 = { path = "crates/protocols/tecdsa-wmc24" }
tecdsa-trout = { path = "crates/protocols/tecdsa-trout" }
tecdsa-xal23 = { path = "crates/protocols/tecdsa-xal23" }
tecdsa-lin17 = { path = "crates/protocols/tecdsa-lin17" }
tecdsa-kgg24 = { path = "crates/protocols/tecdsa-kgg24" }
tecdsa-xal21 = { path = "crates/protocols/tecdsa-xal21" }
tecdsa-abc24 = { path = "crates/protocols/tecdsa-abc24" }
tecdsa-ku24 = { path = "crates/protocols/tecdsa-ku24" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# `all` (correctness/suspicious/style/complexity/perf) is denied — these are
# real issues and block CI. `pedantic` is opinionated style noise (e.g.
# doc_markdown backticks, must_use_candidate); we keep it off so contributors
# aren't blocked on nitpicks. Cargo.toml is the single source of truth, so
# local `cargo clippy` and CI agree automatically.
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }

# Domain-specific allows: these clippy::all lints fight the natural shape of
# cryptographic protocol code, so we allow them workspace-wide rather than
# scattering dozens of #[allow]s. All are style/complexity lints, not
# correctness/suspicious/perf — the valuable parts of clippy::all stay denied.
#   - needless_range_loop: indexed field/group arithmetic over parallel vecs
#     and bit positions (e.g. `&e >> i`) reads more clearly as a range loop.
#   - too_many_arguments: protocol round functions legitimately take many
#     keys/parameters; bundling them into structs obscures the math.
#   - large_enum_variant: protocol message enums naturally have variants of
#     differing size; boxing every large variant adds allocations for no gain.
needless_range_loop = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"


# Build profiles. Overflow checks were previously forced on for every profile via
# `.cargo/config.toml` RUSTFLAGS; they are now scoped here so benchmarks run
# without the per-operation overflow branches (a real cost in the class-group /
# bigint hot loops) while release keeps them on for safety. dev/test inherit the
# default `overflow-checks = true`.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

# `bench` inherits from `release`; turn overflow checks off (the suite measures
# protocol crypto, not arithmetic safety) and keep the LTO/codegen-units tuning.
[profile.bench]
overflow-checks = false
lto = "fat"
codegen-units = 1

