[advisories]
# `unmaintained` is now a scope selector (all|workspace|transitive|none),
# not a lint level. Switch to "all" for a stricter audit, "transitive" or "none"
# to loosen.
unmaintained = "workspace"
# RUSTSEC-2025-0141: bincode was marked unmaintained after the team ceased
# development following a harassment incident. It is NOT a security
# vulnerability.
ignore = ["RUSTSEC-2025-0141"]

[licenses]
# Kept in sync with what the dependency tree actually uses, so cargo-deny warns
# when an entry stops matching any crate. Add a license here only once some
# dependency actually needs it.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "LGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
