[advisories]
# `unmaintained` is now a scope selector (all|workspace|transitive|none),
# not a lint level. Switch to "all" for a stricter audit, "transitive" or "none"
# to loosen.
unmaintained = "workspace"
# RUSTSEC-2025-0141: bincode was marked unmaintained after the team ceased
# development following a harassment incident. It is NOT a security
# vulnerability.
ignore = ["RUSTSEC-2025-0141"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
]

# One exception per crate: the schema uses singular `crate`, not `crates = [...]`.
[[licenses.exceptions]]
crate = "bicycl-rs"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "bicycl-rs-sys"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "tecdsa-class-group"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "tecdsa-wmy23"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "tecdsa-tx25"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "tecdsa-jtx25"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "tecdsa-wmc24"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "tecdsa-llz25"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "tecdsa-trout"
allow = ["GPL-3.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
