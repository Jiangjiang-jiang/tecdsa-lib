[advisories]
# Vulnerabilities are denied by default in this cargo-deny version (the old
# `vulnerability = "deny"` key was removed); use `ignore = [...]` to allow
# specific advisory IDs.
# `unmaintained` is now a scope selector (all|workspace|transitive|none),
# not a lint level. "workspace" only flags our own crates, so a transitive
# unmaintained dependency won't block PRs. Switch to "all" for a stricter audit.
unmaintained = "workspace"

[licenses]
# Crates with no license expression are denied by default (the old
# `unlicensed = "deny"` key was removed); only the licenses below are allowed.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
]

# One exception per crate: the schema uses singular `crate`, not `crates = [...]`.
[[licenses.exceptions]]
crate = "bicycl-rs"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "bicycl-rs-sys"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "tecdsa-class-group"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "tecdsa-wmy23"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "tecdsa-tx25"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "tecdsa-jtx25"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "tecdsa-wmc24"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "tecdsa-llz25"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "tecdsa-trout"
allow = ["GPL-3.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
