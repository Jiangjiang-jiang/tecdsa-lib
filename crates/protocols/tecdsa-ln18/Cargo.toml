[package]
name = "tecdsa-ln18"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "LN18 threshold ECDSA protocol (Paillier + OT variants)"

[features]
default = ["serde", "secp256k1", "mta-paillier"]
serde = ["dep:serde"]
secp256k1 = ["tecdsa-curve/secp256k1"]
mta-paillier = []
mta-ot = []

[dependencies]
tecdsa-pedersen-mod = { workspace = true }
tecdsa-core.workspace = true
tecdsa-bigint.workspace = true
tecdsa-curve.workspace = true
tecdsa-protocol.workspace = true
tecdsa-vss.workspace = true
tecdsa-paillier.workspace = true
tecdsa-commit.workspace = true
tecdsa-ot.workspace = true
k256.workspace = true
elliptic-curve.workspace = true
sha2.workspace = true
rand_core.workspace = true
rand.workspace = true
zeroize.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
tecdsa-testkit.workspace = true
sha2.workspace = true

[lints]
workspace = true
