[package]
name = "tecdsa-wmy23"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
description = "WMY23 Real Threshold ECDSA (CL-based MtA, robust, NDSS 2023)"

[features]
default = ["serde", "secp256k1"]
serde = ["dep:serde"]
secp256k1 = ["tecdsa-curve/secp256k1"]

[dependencies]
tecdsa-core = { workspace = true, features = ["std"] }
tecdsa-curve = { workspace = true, features = ["std"] }
tecdsa-protocol = { workspace = true, features = ["std"] }
tecdsa-vss.workspace = true
tecdsa-commit.workspace = true
tecdsa-class-group.workspace = true
k256.workspace = true
elliptic-curve.workspace = true
sha2.workspace = true
rand_core.workspace = true
rand.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
zeroize.workspace = true
subtle.workspace = true
serde = { workspace = true, optional = true }
bincode.workspace = true
thiserror.workspace = true

[dev-dependencies]
tecdsa-testkit.workspace = true

[lints]
workspace = true
