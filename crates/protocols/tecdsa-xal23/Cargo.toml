[package]
name = "tecdsa-xal23"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "XAL23 threshold ECDSA protocol (JL-based MtA)"

[features]
default = ["serde", "secp256k1"]
serde = ["dep:serde"]
secp256k1 = ["tecdsa-curve/secp256k1"]

[dependencies]
tecdsa-core = { workspace = true, features = ["std"] }
tecdsa-bigint.workspace = true
tecdsa-curve = { workspace = true, features = ["std"] }
tecdsa-protocol = { workspace = true, features = ["std"] }
tecdsa-vss.workspace = true
tecdsa-joye-libert.workspace = true
tecdsa-commit.workspace = true
k256.workspace = true
elliptic-curve.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
sha2.workspace = true
rand_core.workspace = true
rand.workspace = true
zeroize.workspace = true
serde = { workspace = true, optional = true }
bincode.workspace = true
thiserror.workspace = true

[dev-dependencies]
tecdsa-testkit.workspace = true
sha2.workspace = true
rand.workspace = true

[lints]
workspace = true
