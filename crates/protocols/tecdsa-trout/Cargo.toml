[package]
name = "tecdsa-trout"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
description = "Trout: Two-Round Threshold ECDSA from Class Groups (Dahari-Garbian, Nof, Parker)"

[features]
default = ["serde", "secp256k1"]
serde = ["dep:serde"]
secp256k1 = ["tecdsa-curve/secp256k1"]

[dependencies]
tecdsa-core.workspace = true
tecdsa-curve.workspace = true
tecdsa-protocol.workspace = true
tecdsa-vss.workspace = true
tecdsa-class-group.workspace = true
tecdsa-bigint.workspace = true
tecdsa-evrf.workspace = true
k256.workspace = true
elliptic-curve.workspace = true
sha2.workspace = true
rand_core.workspace = true
rand.workspace = true
rug.workspace = true
zeroize.workspace = true
subtle.workspace = true
serde = { workspace = true, optional = true }
bincode.workspace = true
thiserror.workspace = true

[dev-dependencies]
tecdsa-testkit.workspace = true

[lints]
workspace = true
