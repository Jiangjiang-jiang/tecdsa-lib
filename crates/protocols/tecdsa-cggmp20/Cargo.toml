[package]
name = "tecdsa-cggmp20"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CGGMP24 (revised CGGMP20) threshold ECDSA protocol"

[features]
default = ["serde", "secp256k1"]
serde = ["dep:serde"]
secp256k1 = ["tecdsa-curve/secp256k1"]
identifiable-abort = []
key-import = ["tecdsa-protocol/key-import"]

[dependencies]
rug = { workspace = true }
tecdsa-core.workspace = true
tecdsa-bigint.workspace = true
tecdsa-curve.workspace = true
elliptic-curve.workspace = true
tecdsa-protocol.workspace = true
tecdsa-vss.workspace = true
tecdsa-paillier.workspace = true
tecdsa-pedersen-mod.workspace = true
tecdsa-commit.workspace = true

k256.workspace = true
serde = { workspace = true, optional = true }
sha2.workspace = true
rand_core.workspace = true
rand.workspace = true
zeroize.workspace = true
thiserror.workspace = true

udigest.workspace = true

[dev-dependencies]
tecdsa-testkit.workspace = true
sha2.workspace = true

[lints]
workspace = true
