[package]
name = "tecdsa-ot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Oblivious transfer and VOLE for tecdsa"

[dependencies]
tecdsa-core = { workspace = true }
tecdsa-curve = { workspace = true, features = ["secp256k1"] }
elliptic-curve = { workspace = true }
k256 = { workspace = true }
sha2 = { workspace = true }
rand_core = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true }
subtle = { workspace = true }
tecdsa-protocol = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rand = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Ported DKLs23 OTE/multiplication code uses indexed loops and inherent type
# conversions that trigger pedantic lints; suppress the noise here.
doc_markdown = "allow"
cast_possible_truncation = "allow"
needless_range_loop = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
manual_let_else = "allow"
redundant_else = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
