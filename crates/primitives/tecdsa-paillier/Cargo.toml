[package]
name = "tecdsa-paillier"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Paillier encryption, ZK proofs and MtA for tecdsa"

[features]
default = []
parallel = ["tecdsa-bigint/parallel", "tecdsa-pedersen-mod/parallel"]

[dependencies]
rug = { workspace = true }
tecdsa-core = { workspace = true }
tecdsa-bigint = { workspace = true }
tecdsa-commit = { workspace = true }
tecdsa-curve = { workspace = true, features = ["secp256k1"] }
tecdsa-pedersen-mod = { workspace = true }
tecdsa-protocol = { workspace = true }
# `derive` is not a udigest default feature but mta.rs and the ZK proofs need it.
udigest = { workspace = true, features = ["derive", "inline-struct"] }
digest = { workspace = true }
rand_hash = "0.1"
serde_with = { version = "2", default-features = false, features = ["macros"] }
elliptic-curve = { workspace = true }
k256 = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tecdsa-curve = { workspace = true, features = ["secp256k1", "secp256r1"] }
p256 = { workspace = true }
rand = { workspace = true }
rand_dev = "0.1"
bincode = { workspace = true }
subtle = { workspace = true }

[lints]
workspace = true
