name: sync-upstream

on:
  schedule:
    - cron: '0 4 * * 1'   # every Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://gite.lirmm.fr/crypto/bicycl.git || true
          git fetch upstream master

      - name: Attempt rebase
        id: rebase
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rebase upstream/master; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push rebased branch
        if: steps.rebase.outputs.status == 'ok'
        run: |
          # only push if there are actually new upstream commits
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            git push --force-with-lease origin master
          fi

      - name: Open issue on conflict
        if: steps.rebase.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --label sync-upstream --state open --limit 1 --json number -q '.[0].number')
          if [ -z "$existing" ]; then
            gh label create sync-upstream --color D93F0B --description "Upstream sync conflict" 2>/dev/null || true
            gh issue create \
              --title "Upstream sync: rebase conflict" \
              --label sync-upstream \
              --body "Automatic rebase onto upstream/master failed with conflicts. Please rebase manually."
          fi
