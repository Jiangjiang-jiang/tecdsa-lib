name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        threads: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libgmp-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake gmp openssl@3

      - name: Set macOS paths
        if: runner.os == 'macOS'
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix gmp);$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-openssl

      - name: Build & test (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -DWITH_THREADS=${{ matrix.threads }}
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Build & test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -B build -G "MinGW Makefiles" -DWITH_THREADS=${{ matrix.threads }}
          cmake --build build
          ctest --test-dir build --output-on-failure

  build-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libgmp-dev
      - name: Build benchmarks and examples
        run: |
          cmake -B build
          cmake --build build
          cmake --build build --target benchs_build examples
