[package]
name = "bicycl-rs-sys"
version = "0.2.0"
edition = "2021"
links = "bicycl_capi"
license = "GPL-3.0-or-later"
description = "Low-level Rust FFI bindings for BICYCL C API"
readme = "README.md"
keywords = ["ffi", "crypto", "class-group", "bicycl"]
categories = ["api-bindings", "cryptography"]
include = [
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "build.rs",
  "src/**",
  "tests/**",
  "capi/**",
  "vendor/bicycl/src/**",
  "vendor/bicycl/LICENSE",
  "vendor/bicycl/AUTHORS",
]

[build-dependencies]
cmake = "0.1"
